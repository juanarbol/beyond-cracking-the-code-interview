name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build

      - name: Run tests with ctest
        run: |
          cd build
          ctest --output-on-failure -T Test

      # Generate JUnit XML report for GitHub
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtest-results
          path: build/Testing
